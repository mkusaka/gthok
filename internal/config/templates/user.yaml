# yaml-language-server: $schema=https://raw.githubusercontent.com/mkusaka/gthok/main/schema/config.schema.json
# gthok user config. Validate with `gthok config validate`.
# Preview decisions with `gthok explain -- push origin main`.
# Direct calls to the real Git bypass this wrapper; it is not a security boundary.
version: 1

policy:
  # observe logs decisions without blocking; enforce applies denials.
  mode: observe
  # Unclassified write/unknown operations: allow | audit (default) | deny.
  unknownMutation: audit
  # Unavailable, oversized or timed-out input: allow | audit (default) | deny.
  unknownInput: audit
  rules: []
  # - id: no-unconditional-push
  #   match:
  #     operation: remote.push.update
  #     parameters: {forceMode: unconditional}
  #   decision: deny                  # deny | audit | warn
  #   reason: use --force-with-lease

# Hooks receive JSON stdin and answer {"decision":"allow|deny|abstain"}.
# Commands are argv, not shell snippets. Relative paths resolve from this file.
# Parallel/background items are joined before the phase completes.
hooks: {}
# pre:
#   - id: check-push
#     match: {operation: "remote.push.*"}
#     command: [./hooks/check-push]
#     timeout: 10s
#     onError: deny                  # pre default; post default is ignore
# post:
#   - id: failed-git
#     match: {result: failure}
#     command: [./hooks/notify-failure]
#     captureOutput: false

# User-only path trust runs ALL project executables in these locations as you.
# Prefer per-executable review with `gthok config trust` when possible.
# trust:
#   repositories: ["~/src/my-repo"]  # exact roots, including linked worktrees
#   directories: ["~/src/my-org"]   # directory and descendants

runtime: {}
# hookConcurrency: 4
# stdinMaxBytes: 8388608
# stdinTimeout: 3s
# fileMaxBytes: 8388608
# captureLimit: 1048576
# resolveTimeout: 2s
# realGit: /opt/homebrew/bin/git     # otherwise discovered on PATH

logging: {}
# enabled: true
# ignoredHooksWarning: true
# path: /absolute/path/gthok.jsonl
# level: info                       # info | decision (warnings/denials/errors)

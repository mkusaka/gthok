# yaml-language-server: $schema=https://raw.githubusercontent.com/mkusaka/gthok/main/schema/project.schema.json
# Shared repository policy. It can tighten, but never weaken, user policy.
# runtime/logging and trust.repositories/directories are user-only.
# Project executables need `gthok config trust` unless covered by user path trust.
# Trust hashes each executable's definition, command file, files and trust.include.
# Changed pre gates deny matching requests in enforce mode until re-trusted.
version: 1

policy:
  # mode: enforce
  # unknownMutation: deny
  # unknownInput: deny
  rules: []
  # - id: no-unconditional-push
  #   match:
  #     operation: remote.push.update
  #     parameters: {forceMode: unconditional}
  #   decision: deny
  #   reason: use --force-with-lease

# Project commands must use relative or absolute paths, not bare PATH names.
# Relative paths resolve under the repository root.
hooks: {}
# pre:
#   - id: project-check-push
#     match: {operation: "remote.push.*"}
#     command: [./scripts/gthok/check-push]
#     files: [scripts/gthok/lib.sh]
#     timeout: 10s
#     onError: deny

# List shared dependencies; interpreters and unlisted imports are not hashed.
# trust:
#   include: [.gitleaks.toml]

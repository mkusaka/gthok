name: "Setup gthok"
description: "Install gthok (Git wrapper with pre/post hooks and policies) and optionally route `git` through it"
author: "mkusaka"

branding:
  icon: "shield"
  color: "gray-dark"

inputs:
  version:
    description: >-
      gthok release tag to install (e.g. v0.0.1, or "latest").
    required: false
    default: "latest"
  shim:
    description: "Put a git -> gthok shim first on PATH so later steps' `git` goes through gthok"
    required: false
    default: "true"
  token:
    description: "Token used to download and verify the release"
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: "Installed gthok release tag"
    value: ${{ steps.resolve.outputs.tag }}
  path:
    description: "Absolute path of the installed gthok binary"
    value: ${{ steps.install.outputs.path }}

runs:
  using: "composite"
  steps:
    - name: Resolve gthok release
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ACTION_REPO: ${{ github.action_repository }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        repo="${ACTION_REPO:-mkusaka/gthok}"
        tag="${INPUT_VERSION:-latest}"
        if [[ "${tag}" == "latest" ]]; then
          tag="$(gh release view --repo "${repo}" --json tagName --jq .tagName)"
        fi
        if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Expected a gthok release tag in vX.Y.Z format, got '${tag}'."
          exit 1
        fi
        echo "repo=${repo}" >> "${GITHUB_OUTPUT}"
        echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

    - name: Install gthok
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ steps.resolve.outputs.repo }}
        TAG: ${{ steps.resolve.outputs.tag }}
        RUNNER_OS_VALUE: ${{ runner.os }}
        RUNNER_ARCH_VALUE: ${{ runner.arch }}
      run: | # zizmor: ignore[github-env] -- adding the tool to PATH is the purpose; values are fixed RUNNER_TEMP paths
        set -euo pipefail
        case "${RUNNER_OS_VALUE}" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "::error::gthok supports Linux and macOS runners only (got ${RUNNER_OS_VALUE})"; exit 1 ;;
        esac
        case "${RUNNER_ARCH_VALUE}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Unsupported architecture: ${RUNNER_ARCH_VALUE}"; exit 1 ;;
        esac
        asset="gthok_${TAG#v}_${os}_${arch}.tar.gz"
        dir="${RUNNER_TEMP}/gthok"
        rm -rf "${dir}" && mkdir -p "${dir}/bin"
        gh release download "${TAG}" --repo "${REPO}" --pattern "${asset}" --pattern checksums.txt --dir "${dir}"
        # Immutable release attestation: the asset is exactly what the release published.
        gh release verify-asset "${TAG}" "${dir}/${asset}" --repo "${REPO}"
        checksum="$(awk -v asset="${asset}" '$2 == asset { print $1 }' "${dir}/checksums.txt")"
        [[ "${checksum}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing or invalid checksum for ${asset}"; exit 1; }
        (cd "${dir}" && printf '%s  %s\n' "${checksum}" "${asset}" | {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c -
          else
            shasum -a 256 -c -
          fi
        })
        tar -xzf "${dir}/${asset}" -C "${dir}/bin" gthok
        "${dir}/bin/gthok" version
        echo "${dir}/bin" >> "${GITHUB_PATH}"
        echo "path=${dir}/bin/gthok" >> "${GITHUB_OUTPUT}"

    - name: Route git through gthok
      if: inputs.shim == 'true'
      shell: bash
      env:
        GTHOK: ${{ steps.install.outputs.path }}
      run: | # zizmor: ignore[github-env] -- adding the tool to PATH is the purpose; values are fixed RUNNER_TEMP paths
        set -euo pipefail
        shim_dir="${RUNNER_TEMP}/gthok/shim"
        "${GTHOK}" shim install --bin-dir "${shim_dir}"
        # GITHUB_PATH entries are prepended, so later steps resolve `git` to the shim.
        echo "${shim_dir}" >> "${GITHUB_PATH}"

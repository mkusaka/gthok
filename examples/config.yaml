# yaml-language-server: $schema=https://raw.githubusercontent.com/mkusaka/gthok/v0.0.1/schema/config.schema.json
# User config: ~/.config/gthok/config.yaml. Build binaries as described in README.md.
version: 1
policy:
  mode: enforce
  unknownMutation: audit
  unknownInput: audit
  rules:
    - id: no-protected-deletes
      match:
        operation: remote.push.delete
        refs: [refs/heads/main, "refs/heads/release/**"]
      decision: deny
      reason: Protected branches must not be deleted.
    - id: warn-hard-reset
      match:
        operation: worktree.reset.hard
      decision: warn
      reason: A hard reset discards tracked working-tree changes.
hooks:
  pre:
    - id: deny-force-push
      match:
        operation: "remote.push.*"
        refs: [refs/heads/main, "refs/heads/release/**"]
      command: ["./hooks/deny-force-push"]
      timeout: 5s
      onError: deny
  post:
    - id: audit-history
      match:
        operation: [history.commit.amend, "history.rebase.*", "worktree.reset.*", "remote.push.*"]
      command: ["./hooks/audit-history"]
      timeout: 5s
      onError: ignore
      redactInput: true
transforms:
  pre:
    - id: commit-trailer
      match:
        operation: [history.commit.create, history.commit.amend]
      command: ["./transforms/commit-trailer"]
      timeout: 5s
      onError: deny
logging:
  enabled: true

# User config fragment; install and review your own cache executable first.
# The executable must decline with 125 and no stdout when its cache is stale.
version: 1
delegates:
  - id: cached-log
    match:
      level: L1
      effect: read
      operation: git.log.read
      repoRoots: ["/srv/checkouts/**"]
    command: ["/opt/local/bin/git-log-cache"]
    timeout: 2s
    onError: fallback
# Git argv are appended unchanged. Only classification.retrySafe requests route;
# log --output, log -p with possible textconv, and unknown flags do not qualify.
